# systemd drop-in for the center's tunnel:
#   /etc/systemd/system/wg-quick@hs-edge.service.d/10-after-docker.conf
# The tunnel's firewall rules use Docker's DOCKER-USER chain, which exists once Docker runs. If
# Docker is not up the rules fail, wg-quick fails and the tunnel stays down: the edge then shows
# its fallback page (fails closed, ADR 0028 decision 5).
[Unit]
Wants=docker.service
After=docker.service network-online.target
Wants=network-online.target

[Service]
Restart=on-failure
RestartSec=30s
